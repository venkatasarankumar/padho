<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="540" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D6E7D8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#153D32" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="cardShadow" x="-10" y="-5" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#153D32" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background decorative canvas blobs -->
  <rect x="20" y="20" width="500" height="400" rx="28" fill="url(#bgGrad)"/>
  <circle cx="460" cy="80" r="45" fill="#D8A96B" fill-opacity="0.12"/>
  <circle cx="80" cy="350" r="60" fill="#153D32" fill-opacity="0.05"/>

  <!-- Main Study Desk & Character Concept -->
  <!-- Desk Base -->
  <path d="M70 340 H470" stroke="#153D32" stroke-width="4" stroke-linecap="round"/>
  <rect x="110" y="344" width="12" height="60" rx="3" fill="#153D32" fill-opacity="0.3"/>
  <rect x="418" y="344" width="12" height="60" rx="3" fill="#153D32" fill-opacity="0.3"/>

  <!-- Laptop on Desk -->
  <rect x="210" y="270" width="120" height="70" rx="8" fill="#FFFFFF" stroke="#E6E8E2" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="218" y="276" width="104" height="54" rx="4" fill="#153D32"/>
  <!-- Screen Content: Code / Notes lines -->
  <rect x="228" y="286" width="40" height="4" rx="2" fill="#D6E7D8"/>
  <rect x="228" y="294" width="70" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.7"/>
  <rect x="228" y="301" width="55" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.5"/>
  <rect x="228" y="308" width="80" height="3" rx="1.5" fill="#D8A96B"/>
  <rect x="228" y="316" width="45" height="3" rx="1.5" fill="#D6E7D8"/>
  <!-- Laptop base -->
  <path d="M195 340 H345 L335 344 H205 Z" fill="#E6E8E2"/>

  <!-- Books Stack on Left -->
  <rect x="100" y="322" width="75" height="18" rx="3" fill="#153D32"/>
  <rect x="105" y="304" width="70" height="18" rx="3" fill="#285A48"/>
  <rect x="110" y="286" width="60" height="18" rx="3" fill="#D8A96B"/>
  <line x1="160" y1="289" x2="160" y2="301" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Desk Lamp on Right -->
  <path d="M410 340 C410 300 410 240 370 210" stroke="#153D32" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M360 205 L385 220 L350 235 Z" fill="#D8A96B"/>
  <circle cx="360" cy="205" r="5" fill="#153D32"/>
  <!-- Warm glow from lamp -->
  <path d="M350 235 L300 340 L380 340 Z" fill="#D8A96B" fill-opacity="0.06"/>

  <!-- Floating Feature Card 1: Syllabus Verified -->
  <g transform="translate(40, 70)" filter="url(#cardShadow)">
    <rect width="180" height="64" rx="14" fill="#FFFFFF" stroke="#E6E8E2"/>
    <circle cx="34" cy="32" r="16" fill="#D6E7D8"/>
    <!-- Checkmark icon -->
    <path d="M28 32 L32 36 L40 28" stroke="#153D32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="28" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#153D32">Verified Syllabus</text>
    <text x="58" y="44" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#727A73">NTA • SSC • IBPS • RRB</text>
  </g>

  <!-- Floating Feature Card 2: Bilingual Learning (English & Telugu) -->
  <g transform="translate(320, 130)" filter="url(#cardShadow)">
    <rect width="180" height="64" rx="14" fill="#FFFFFF" stroke="#E6E8E2"/>
    <circle cx="34" cy="32" r="16" fill="#153D32"/>
    <!-- Language icon: A and తె -->
    <text x="34" y="37" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#D8A96B" text-anchor="middle">A / తె</text>
    <text x="58" y="28" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#153D32">Bilingual Access</text>
    <text x="58" y="44" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#727A73">English &amp; తెలుగు Resources</text>
  </g>

  <!-- Floating Feature Card 3: 100% Free Resources -->
  <g transform="translate(260, 310)" filter="url(#cardShadow)">
    <rect width="190" height="58" rx="14" fill="#153D32"/>
    <circle cx="30" cy="29" r="14" fill="#D8A96B"/>
    <path d="M26 29 L29 32 L36 25" stroke="#153D32" stroke-width="2" stroke-linecap="round"/>
    <text x="52" y="25" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">100% Free Platform</text>
    <text x="52" y="40" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#D6E7D8">For post-10th &amp; Inter students</text>
  </g>

  <!-- Small floating decorative geometric badges -->
  <g transform="translate(80, 200)">
    <circle cx="16" cy="16" r="16" fill="#FFFFFF" stroke="#E6E8E2"/>
    <text x="16" y="21" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#153D32" text-anchor="middle">NCERT</text>
  </g>

  <g transform="translate(430, 240)">
    <circle cx="16" cy="16" r="16" fill="#D6E7D8"/>
    <text x="16" y="21" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#153D32" text-anchor="middle">PYQ</text>
  </g>
</svg>

